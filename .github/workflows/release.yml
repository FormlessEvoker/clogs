name: Release

# A merge into main publishes a release. The version bump comes from the label
# on the pull request that produced the commit, the tag is created here, and
# the compiled binaries are attached to the GitHub release.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Two merges in quick succession must not race for the same version number.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The next version is derived from the existing tags, so the whole
          # history and every tag has to be present.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Resolve the next version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # for-each-ref rather than a pipe into head: closing the pipe early
          # would trip pipefail once the repository has many tags.
          latest_tag() {
            git for-each-ref --sort=-v:refname --count="${1:-1}" \
              --format='%(refname:short)' 'refs/tags/v[0-9]*'
          }

          latest=$(latest_tag)

          # A tag with no published release means a previous run tagged the
          # commit and then died before publishing (archive build failure,
          # `gh` outage, runner eviction). Finish that release instead of
          # computing a new one, so re-running this workflow is always the
          # fix for a stuck release rather than a manual out-of-band tag.
          if [ -n "$latest" ] && ! gh release view "$latest" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Tag $latest exists with no published release; resuming it instead of cutting a new one."
            previous=$(latest_tag 2 | sed -n '2p')
            {
              echo "release=true"
              echo "version=$latest"
              echo "previous=$previous"
              echo "tag_exists=true"
            } >>"$GITHUB_OUTPUT"
            exit 0
          fi

          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            echo "::notice::No pull request produced this commit, so there is nothing to release."
            echo "release=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          bumps=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json labels \
            --jq '[.labels[].name | select(. == "major" or . == "minor" or . == "patch")] | join(" ")')

          # Split the space separated labels into positional parameters to
          # count them.
          set -- $bumps
          if [ "$#" -ne 1 ]; then
            echo "::error::Pull request #$pr carries $# version labels, expected exactly one of major, minor, or patch."
            exit 1
          fi
          bump=$1

          next=$(go run ./cmd/nextversion "$latest" "$bump")
          echo "Pull request #$pr is a $bump bump: ${latest:-no tags} -> $next"

          {
            echo "release=true"
            echo "version=$next"
            echo "previous=$latest"
            echo "tag_exists=false"
          } >>"$GITHUB_OUTPUT"

      # A tag must never point at a commit that does not pass its own checks,
      # even though the same checks already passed on the pull request.
      - name: Verify the commit
        if: steps.version.outputs.release == 'true'
        run: make check

      - name: Build the release archives
        if: steps.version.outputs.release == 'true'
        run: make release-build VERSION=${{ steps.version.outputs.version }}

      - name: Tag the release
        if: steps.version.outputs.release == 'true' && steps.version.outputs.tag_exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "clogs $VERSION"
          git push origin "$VERSION"

      - name: Publish the release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          set -euo pipefail
          notes_from=""
          if [ -n "$PREVIOUS" ]; then
            notes_from="--notes-start-tag=$PREVIOUS"
          fi

          # notes_from is deliberately unquoted so that an empty value expands
          # to no argument at all.
          gh release create "$VERSION" \
            --title "clogs $VERSION" \
            --generate-notes $notes_from \
            bin/dist/*.tar.gz bin/dist/*.zip bin/dist/checksums.txt
