name: Release

# A merge into main publishes a release. The version bump comes from the label
# on the pull request that produced the commit, the tag is created here, and
# the compiled binaries are attached to the GitHub release.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Two merges in quick succession must not race for the same version number.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The next version is derived from the existing tags, so the whole
          # history and every tag has to be present.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Resolve the next version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            echo "::notice::No pull request produced this commit, so there is nothing to release."
            echo "release=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          bumps=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json labels \
            --jq '[.labels[].name | select(. == "major" or . == "minor" or . == "patch")] | join(" ")')

          # Split the space separated labels into positional parameters to
          # count them.
          set -- $bumps
          if [ "$#" -ne 1 ]; then
            echo "::error::Pull request #$pr carries $# version labels, expected exactly one of major, minor, or patch."
            exit 1
          fi
          bump=$1

          # for-each-ref rather than a pipe into head: closing the pipe early
          # would trip pipefail once the repository has many tags.
          current=$(git for-each-ref --sort=-v:refname --count=1 \
            --format='%(refname:short)' 'refs/tags/v[0-9]*')
          next=$(./scripts/next-version.sh "$current" "$bump")
          echo "Pull request #$pr is a $bump bump: ${current:-no tags} -> $next"

          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "::notice::Tag $next already exists, so this release has already been published."
            echo "release=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "release=true"
            echo "version=$next"
            echo "previous=$current"
          } >>"$GITHUB_OUTPUT"

      # A tag must never point at a commit that does not pass its own checks,
      # even though the same checks already passed on the pull request.
      - name: Verify the commit
        if: steps.version.outputs.release == 'true'
        run: make check

      - name: Build the release archives
        if: steps.version.outputs.release == 'true'
        run: make release-build VERSION=${{ steps.version.outputs.version }}

      - name: Tag the release
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "clogs $VERSION"
          git push origin "$VERSION"

      - name: Publish the release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          set -euo pipefail
          notes_from=""
          if [ -n "$PREVIOUS" ]; then
            notes_from="--notes-start-tag=$PREVIOUS"
          fi

          # notes_from is deliberately unquoted so that an empty value expands
          # to no argument at all.
          gh release create "$VERSION" \
            --title "clogs $VERSION" \
            --generate-notes $notes_from \
            bin/dist/*.tar.gz bin/dist/*.zip bin/dist/checksums.txt
