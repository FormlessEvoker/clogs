name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      # fmt-check, lint, test, test-race, and the prohibited-content gate.
      - run: make check

      - run: CGO_ENABLED=0 go build ./cmd/clogs
