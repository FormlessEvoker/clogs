name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A merge queue needs every required check to report on merge groups too, so
  # the triggers are already in place if this repository moves to an
  # organization and turns the queue rule on.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      # fmt-check, lint, test, test-race, and the prohibited-content gate.
      - run: make check

      - run: CGO_ENABLED=0 go build ./cmd/clogs

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      # Every published release target must still compile before a change
      # lands, so a broken target fails here rather than halfway through a
      # release that has already moved the version tag.
      - run: make cross-build
