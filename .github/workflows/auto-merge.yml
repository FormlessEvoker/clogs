name: Auto merge

# Approving a pull request hands it to GitHub, which merges it once every
# required check passes. When this repository moves to an organization and the
# merge queue rule is enabled, the same call places the pull request in the
# queue instead, and this workflow needs no edit.

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: >-
      github.event.review.state == 'approved' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Merge once the required checks pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if gh pr merge --auto --squash "$PR_URL"; then
            exit 0
          fi

          # GitHub rejects an auto merge request when the pull request is
          # already mergeable, because there is nothing left to wait for.
          echo "::warning::Could not arm auto merge. Trying a direct merge in case every requirement is already met."
          gh pr merge --squash "$PR_URL"
