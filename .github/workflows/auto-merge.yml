name: Auto merge

# Approving a pull request hands it to GitHub, which merges it once every
# required check passes. When this repository moves to an organization and the
# merge queue rule is enabled, the same call places the pull request in the
# queue instead, and this workflow needs no edit.

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: >-
      github.event.review.state == 'approved' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Merge once the required checks pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if gh pr merge --auto --squash "$PR_URL"; then
            exit 0
          fi

          # `--auto` fails both when the pull request is already mergeable
          # (nothing left to wait for) and when "Allow auto-merge" is off for
          # the repository. Only the first case is safe to fall through on:
          # confirm mergeStateStatus is CLEAN ourselves rather than assuming
          # the failure reason, so a disabled auto-merge setting can't turn
          # every approval into an unconditional merge that skips checks.
          echo "::warning::Could not arm auto merge. Checking whether the pull request is already mergeable."
          state=$(gh pr view "$PR_URL" --json mergeStateStatus --jq .mergeStateStatus)
          if [ "$state" != "CLEAN" ]; then
            echo "::error::Auto merge could not be armed and the pull request is not mergeable yet (state: $state)."
            exit 1
          fi

          gh pr merge --squash "$PR_URL"
